{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

</head>

<body>

<header class="landing-navbar">

    <div class="logo">

        <a href="{% url 'index_page' %}">
            EcoSphere
        </a>

    </div>

    <nav>

        <a href="{% url 'index_page' %}" class="nav-btn">

            <i class="fa-solid fa-house"></i>

            Home

        </a>

        <a href="{% url 'all_posts' %}" class="nav-btn">

            <i class="fa-solid fa-book"></i>

            Blog Posts

        </a>

        <a href="{% url 'create_post' %}" class="nav-btn create-nav-btn">

            <i class="fa-solid fa-plus"></i>

            Create Post

        </a>

        <a href="{% url 'profile' %}" class="nav-btn">

            <i class="fa-solid fa-user"></i>

            Profile

        </a>

        {% if request.user.is_authenticated %}

            <span class="welcome-user">

                <i class="fa-solid fa-user"></i>

                {{ request.user.username }}

            </span>

            <form action="{% url 'logout' %}" method="POST">

                {% csrf_token %}

                <button type="submit" class="logout-btn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </button>

            </form>

        {% else %}

            <a href="{% url 'login' %}" class="nav-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </a>

            <a href="{% url 'register' %}" class="nav-btn">

                <i class="fa-solid fa-user-plus"></i>

                Register

            </a>

        {% endif %}

    </nav>

</header>

<main>

    {% block content %}

    {% endblock %}

</main>

</body>

</html>
