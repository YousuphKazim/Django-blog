{% extends "base.html" %}

{% load static %}

{% block title %}
Create Post | EcoSphere
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Create New Post</h1>

    <p class="form-subtitle">
        Share your thoughts with the world.
    </p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="form-group">

            <label for="title">Title</label>

            <input
                type="text"
                name="title"
                id="title"
                placeholder="Enter post title"
                value="{{ form.title.value|default:'' }}"
            >

            <p style="color:red;">
                {{ form.title.errors }}
            </p>

        </div>

        <div class="form-group">

            <label for="image">Featured Image</label>

            <input
                type="file"
                name="image"
                id="image"
            >

            <p style="color:red;">
                {{ form.image.errors }}
            </p>

        </div>

        <div class="form-group">

            <label for="content">Content</label>

            <textarea
                id="content"
                name="content"
                placeholder="Write your post here..."
            >{{ form.content.value|default:'' }}</textarea>

            <p style="color:red;">
                {{ form.content.errors }}
            </p>

        </div>

        <div class="button-group">

            <button class="create-btn" type="submit">

                Publish Post

            </button>

            <a href="{% url 'all_posts' %}" class="cancel-btn">

                Cancel

            </a>

        </div>

    </form>

</div>

{% endblock %}
